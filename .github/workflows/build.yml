name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q 2k20-mod-studio.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: 2k20-mod-studio

      - name: Build release APK
        run: gradle assembleRelease --no-daemon
        working-directory: 2k20-mod-studio

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: modstudio-debug-apk
          path: 2k20-mod-studio/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: modstudio-release-apk
          path: 2k20-mod-studio/app/build/outputs/apk/release/*.apk
