# Rescue workflow: builds the APK straight from the uploaded ZIP.
# Use this when your GitHub repo contains only "2k20-mod-studio.zip"
# and no extracted project folders.
#
# 1. On your repo page tap "Add file" -> "Create new file"
# 2. Type the file name exactly:  .github/workflows/build.yml
#    (typing the first "/" creates the folders; keep the leading dot)
# 3. Paste ALL of the text below, scroll down, "Commit changes"
# 4. The build starts by itself - watch it in the "Actions" tab

name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q 2k20-mod-studio.zip
        # NOTE: if you renamed the zip, change the line above to the exact name

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: 2k20-mod-studio

      - name: Build release APK (unsigned)
        run: gradle assembleRelease --no-daemon
        working-directory: 2k20-mod-studio

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: modstudio-debug-apk
          path: 2k20-mod-studio/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: modstudio-release-apk
          path: 2k20-mod-studio/app/build/outputs/apk/release/*.apk
